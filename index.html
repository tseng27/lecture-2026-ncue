<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>AI 時代的藝術與教育</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: contemporary gallery. Stone-white wall, light serif display, tiny spaced labels ("07. ABOUT"), hairlines instead of boxes, works hung as framed panels with museum captions. Dark mode = black-box screening room. */
:root{
  --bg:#F3F1ED; --paper:#FAF9F6; --ink:#1F1E1C; --muted:#7B766E; --line:#DCD7CF; --chip:#ECE9E3;
  --red:#8B6B4E; --navy:#3B3A37; --yellow:#C9BBA2; --on-navy:#FAF9F6; --on-yellow:#1F1E1C;
  --accent-ink:#8B6B4E; --navy-ink:#3B3A37; --wall:#E9E6E0; --frame:#D2CCC2;
  --ok:#4F6B55; --ok-bg:transparent; --warn:#8A6A2E; --warn-bg:transparent; --plan:#5D6478; --plan-bg:transparent;
  --f-display:"Cormorant Garamond","Noto Serif TC","Songti TC",serif;
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-label:"Inter","Helvetica Neue",Arial,sans-serif;
  --f-num:"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0D; --paper:#161615; --ink:#ECE9E3; --muted:#8E897F; --line:#2A2927; --chip:#1E1D1B;
  --red:#B8957A; --navy:#4A4844; --yellow:#8C8170; --on-navy:#ECE9E3; --on-yellow:#0E0E0D;
  --accent-ink:#C9A68A; --navy-ink:#CFCAC1; --wall:#1A1A18; --frame:#33312E;
  --ok:#93B39A; --warn:#D2B27A; --plan:#A9AFC2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0D; --paper:#161615; --ink:#ECE9E3; --muted:#8E897F; --line:#2A2927; --chip:#1E1D1B;
  --red:#B8957A; --navy:#4A4844; --yellow:#8C8170; --on-navy:#ECE9E3; --on-yellow:#0E0E0D;
  --accent-ink:#C9A68A; --navy-ink:#CFCAC1; --wall:#1A1A18; --frame:#33312E;
  --ok:#93B39A; --warn:#D2B27A; --plan:#A9AFC2; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:16.5px;line-height:1.85;letter-spacing:.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0;font-weight:400}
b,strong{font-weight:500}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.label,.eyebrow,.sec,.tag,.note.k{font-family:var(--f-label)}

/* ===== bar ===== */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .row{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;font-family:var(--f-serif);font-weight:500;font-size:15px;letter-spacing:.12em;white-space:nowrap;border:0;background:none;padding:0}
.logo i{display:none}
.logo::after{content:"NCUE 2026";font-family:var(--f-label);font-size:10px;letter-spacing:.24em;color:var(--muted)}
.modes{display:inline-flex;gap:16px;flex:none}
.modes button{border:0;background:transparent;padding:2px 0;font-family:var(--f-label);font-size:11px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid transparent}
.modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ibtn{border:1px solid var(--line);background:transparent;border-radius:0;height:32px;min-width:32px;padding:0 12px;font-family:var(--f-label);font-size:12px;letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn:hover{border-color:var(--ink)}
.ibtn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.len{display:inline-flex;border:1px solid var(--line)}
.len button{border:0;background:transparent;padding:5px 10px;font-family:var(--f-label);font-size:12px;color:var(--muted)}
.len button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.clock{font-size:20px;white-space:nowrap;padding:0 4px;cursor:default}
.clock small{color:var(--muted);font-family:var(--f-label);font-size:10px;letter-spacing:.18em;margin-right:6px}
.clock.late{color:var(--accent-ink)}
.strip{display:flex;height:6px;overflow:hidden;background:var(--line);position:relative;margin-bottom:12px}
.strip button{border:0;padding:0;background:transparent;position:relative;border-right:2px solid var(--bg);min-width:0;overflow:hidden}
.strip button:last-of-type{border-right:0}
.strip button::after{display:none}
.strip button.done{background:var(--muted)}
.strip button.on{background:var(--ink)}
.strip button:hover{background:var(--muted)}
.strip .now{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--accent-ink);pointer-events:none;transition:left .5s;z-index:2}
.seglbl{display:flex;margin-bottom:6px;font-family:var(--f-label);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.seglbl span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:6px;min-width:0}
@media (max-width:700px){.seglbl{display:none}}
.menu{display:flex;gap:6px 26px;flex-wrap:wrap;padding-bottom:12px;align-items:baseline}
.menu .grp{display:flex;gap:2px 12px;align-items:baseline;flex-wrap:wrap}
.menu .grp b{font-family:var(--f-label);font-weight:400;font-size:10px;letter-spacing:.22em;color:var(--muted);margin-right:2px}
.menu button{border:0;background:none;padding:2px 0;font-size:14px;border-bottom:1px solid transparent}
.menu button:hover{border-bottom-color:var(--line)}
.menu button[aria-current="page"]{border-bottom-color:var(--ink);font-weight:500}

/* ===== stop banner ===== */
.stop{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-top:22px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.stop b{color:var(--ink);font-weight:400}
.stop b.num{font-size:18px}
.stop .cue{flex:1 1 260px;font-style:normal}
.stop .plus{font-family:var(--f-label);font-size:11px;letter-spacing:.1em;color:var(--accent-ink);border:1px solid currentColor;padding:0 6px}

/* ===== view basics ===== */
main{padding-bottom:96px}
.view{padding-block:52px 24px;animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.strip .now{transition:none}}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:11px;letter-spacing:.24em;color:var(--muted);margin-bottom:22px;text-transform:uppercase}
.tag{background:transparent;color:var(--ink);padding:0;letter-spacing:.24em;font-size:11px;font-weight:500}
.tag::after{content:"";display:inline-block;width:28px;height:1px;background:var(--line);vertical-align:middle;margin-left:14px}
.tag.r,.tag.n,.tag.y{background:transparent;color:var(--ink)}
.chno{font-family:var(--f-display);font-weight:300;font-size:clamp(72px,10vw,132px);line-height:.8;letter-spacing:-.02em;color:var(--muted)}
.chno.n{color:var(--muted)}
.chhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 34px;align-items:end;margin-bottom:40px}
.chhead h2{font-family:var(--f-display),var(--f-serif);font-size:clamp(32px,4.4vw,56px);font-weight:300;letter-spacing:.01em}
.chhead h2 small{display:block;font-family:var(--f-serif);font-size:.42em;font-weight:300;color:var(--muted);margin-top:10px;letter-spacing:.08em}
.chhead .lead{grid-column:1/-1;font-size:clamp(16px,1.4vw,18px);color:var(--muted);max-width:40em;line-height:2}
@media (max-width:640px){.chhead{grid-template-columns:1fr}}
.grid{display:grid;gap:0}
.grid.g2,.grid.g3,.grid.g4,.grid.g5{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.grid.g2>*,.grid.g3>*,.grid.g4>*,.grid.g5>*{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0}
.grid:not(.g2):not(.g3):not(.g4):not(.g5){gap:0}
.grid:not(.g2):not(.g3):not(.g4):not(.g5)>.card{border-left:0;border-right:0;border-top:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:980px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.card{background:transparent;border:1px solid var(--line);border-radius:0;padding:24px 22px;min-width:0}
.card h3{font-family:var(--f-serif);font-size:18px;font-weight:500;margin-bottom:8px;letter-spacing:.04em}
.card p,.card li{color:var(--muted);font-size:15px}
.card ul,.card ol{margin:6px 0 0;padding-left:1.2em}
.sec{font-size:11px;letter-spacing:.24em;color:var(--muted);margin:56px 0 20px;display:flex;align-items:center;gap:16px;text-transform:uppercase}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.photo{overflow:hidden;background:var(--wall);position:relative;min-height:260px}
.photo img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;filter:saturate(.45) contrast(.95) brightness(1.02)}
.photo .cap{position:absolute;left:12px;bottom:10px;font-family:var(--f-label);font-size:10px;letter-spacing:.2em;color:#fff;opacity:.85;text-transform:uppercase}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:stretch}
@media (max-width:860px){.split{grid-template-columns:1fr}.split .photo{min-height:240px}}
.links{display:flex;flex-wrap:wrap;gap:12px 28px}
.lk{display:inline-flex;align-items:center;gap:10px;padding:4px 0;border:0;border-bottom:1px solid var(--ink);font-family:var(--f-label);font-size:12px;letter-spacing:.16em;text-decoration:none;background:transparent;text-transform:uppercase}
.lk::after{content:"⟶";font-family:var(--f-display);letter-spacing:0;transition:transform .3s}
.lk:hover::after{transform:translateX(4px)}
a.lk::after{content:"↗"}
.lk.todo{border-bottom:1px dashed var(--muted);color:var(--muted);cursor:default}
.lk.todo::after{content:none}
.q{font-family:var(--f-serif);font-weight:300;font-size:clamp(22px,2.6vw,32px);line-height:1.6;border-left:1px solid var(--ink);padding-left:24px}
.q small{display:block;font-family:var(--f-body);font-size:15px;color:var(--muted);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px}
.chip{border:1px solid var(--line);padding:4px 14px;font-size:14px}
.note{font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:10.5px;letter-spacing:.12em;padding:0;white-space:nowrap;vertical-align:middle;background:transparent!important}
.st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok)} .st.wip{color:var(--warn)} .st.plan{color:var(--plan)} .st.chk{color:var(--muted)} .st.sug{color:var(--accent-ink)}
.shape{width:30px;height:30px;flex:none;border:1px solid var(--ink);background:transparent!important}
.shape.c{border-radius:50%}
.shape.t{width:30px;height:1px;border:0;background:var(--ink)!important;margin-block:14px}

/* tabs / toggles */
.tabs{display:flex;flex-wrap:wrap;gap:6px 26px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:6px 0 10px;font-size:15px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.seg{display:inline-flex;gap:22px;margin-bottom:20px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:2px 0;color:var(--muted);border-bottom:1px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ===== cover (gallery wall) ===== */
.gallery-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);min-height:min(72vh,640px);margin-top:-52px;background:var(--wall)}
@media (max-width:900px){.gallery-hero{grid-template-columns:1fr}}
.gallery-hero .img{position:relative;min-height:320px;overflow:hidden}
.gallery-hero .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.35) contrast(.92) brightness(1.03)}
.gallery-hero .img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 70%,var(--wall))}
.gallery-hero .txt{padding:56px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.gallery-hero h1{font-family:var(--f-display),var(--f-serif);font-weight:300;font-size:clamp(40px,5.4vw,72px);line-height:1.15;letter-spacing:.01em}
.gallery-hero .sub{color:var(--muted);max-width:28em;font-size:15.5px;line-height:2}
.gallery-hero .who{font-family:var(--f-label);font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.gallery-hero .who b{color:var(--ink);font-family:var(--f-serif);letter-spacing:.2em;font-size:14px;font-weight:500;text-transform:none}
.entry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:44px;border-top:1px solid var(--line)}
@media (max-width:620px){.entry{grid-template-columns:1fr}}
.entry button{text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:26px 4px;display:grid;gap:6px}
.entry button:first-child{border-right:1px solid var(--line);padding-right:24px}
@media (max-width:620px){.entry button:first-child{border-right:0}}
.entry b{font-family:var(--f-serif);font-weight:300;font-size:24px}
.entry b::after{content:"  ⟶";font-family:var(--f-display)}
.entry span{font-size:13.5px;color:var(--muted)}
.entry button:hover b{color:var(--accent-ink)}
/* legacy hero classes kept harmless */
.hero,.composition{display:none}

/* themes list */
.themes{display:grid;border-top:1px solid var(--ink)}
.theme{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:20px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.theme:hover b{color:var(--accent-ink)}
.theme .k{font-family:var(--f-display);font-weight:300;font-size:34px;color:var(--muted)}
.theme b{font-family:var(--f-serif);font-weight:300;font-size:20px}
.theme .ord{font-family:var(--f-label);font-size:10.5px;letter-spacing:.16em;color:var(--muted)}

/* agenda */
.ag{border-top:1px solid var(--ink)}
.ag-row{display:grid;grid-template-columns:80px 70px minmax(0,1fr) 60px;gap:12px;align-items:baseline;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.ag-row:hover{background:var(--paper)}
.ag-row.segh{background:transparent;cursor:default;padding-top:22px;font-family:var(--f-label);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.ag-row.segh i{display:none!important}
.ag-row .t{font-family:var(--f-num);font-size:19px}
.ag-row .m{font-family:var(--f-num);font-size:17px}
.ag-row .x{font-family:var(--f-label);font-size:11px;color:var(--accent-ink)}
@media (max-width:620px){.ag-row{grid-template-columns:56px minmax(0,1fr) 44px}.ag-row .t{display:none}}

/* poll */
.poll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
@media (max-width:760px){.poll{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pbtn{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:20px 18px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.pbtn:hover{background:var(--paper)}
.pbtn b{font-family:var(--f-serif);font-weight:500;font-size:17px}
.pbtn .cnt{font-family:var(--f-num);font-size:48px;font-weight:300;line-height:1}
.pbtn .fill{position:absolute;left:0;bottom:0;height:2px;background:var(--ink)!important;transition:width .3s}
.mini{font-size:12.5px;color:var(--muted);margin-top:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mini button{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--muted);padding:0;font-size:12.5px}

/* steps */
.steps{display:flex;flex-wrap:wrap;gap:4px 20px;margin-bottom:22px}
.steps button{border:0;border-bottom:1px solid transparent;background:transparent;padding:4px 0;font-size:15px;display:inline-flex;gap:6px;align-items:baseline;color:var(--muted)}
.steps button span{font-family:var(--f-num);font-size:15px}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.stepbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.stepbox>div{padding:24px 22px 24px 0;min-width:0}
.stepbox>div+div{padding-left:22px;border-left:1px solid var(--line)}
.stepbox .k{font-family:var(--f-label);font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.stepbox p{font-family:var(--f-serif);font-weight:300;font-size:19px;margin-top:8px}
@media (max-width:760px){.stepbox{grid-template-columns:1fr}.stepbox>div+div{border-left:0;padding-left:0;border-top:1px solid var(--line)}}
.seven{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border-top:1px solid var(--ink)}
@media (max-width:900px){.seven{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.seven div{padding:18px 14px 18px 0;min-width:0;border-bottom:1px solid var(--line)}
.seven .k{font-family:var(--f-num);font-size:22px;color:var(--muted);display:block}
.seven b{display:block;font-family:var(--f-serif);font-weight:500;font-size:16px;margin-top:4px}
.seven p{font-size:13px;color:var(--muted)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);gap:0;align-items:center}
.ba .arrow{font-family:var(--f-display);font-size:34px;font-weight:300;color:var(--muted);text-align:center}
.ba .card{border:0!important;border-top:1px solid var(--line)!important}
.ba .card h3{font-weight:300;font-size:22px}
@media (max-width:700px){.ba{grid-template-columns:1fr}.ba .arrow{transform:rotate(90deg)}}

/* practice */
.prac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media (max-width:900px){.prac{grid-template-columns:1fr}}
.prac .card{border:0;border-top:1px solid var(--ink);padding:18px 0}
.prac label{font-family:var(--f-label);font-size:10.5px;letter-spacing:.2em;color:var(--muted);display:block;margin-bottom:8px;text-transform:uppercase}
.prac input[type=text],.prac textarea{width:100%;font:inherit;font-size:16px;padding:8px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink)}
.prac input[type=text]:focus,.prac textarea:focus{outline:0;border-bottom-color:var(--ink)}
.prac textarea{min-height:84px;resize:vertical}
.slider{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.slider input{width:100%;accent-color:var(--ink)}
.slider span:last-child{text-align:right}
.soundcard{margin-top:26px;background:var(--ink);color:var(--bg);padding:34px 36px;display:grid;gap:10px}

M.lecture = ()=>{
  let L = store.get("len",120); const inp=$("#startAt"); inp.value = store.get("start","");
  const draw=()=>{
    $$("[data-tlen]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.tlen===L));
    const [h,m]=(inp.value||"00:00").split(":").map(Number); let t=h*60+m;
    const f=x=>inp.value?String(Math.floor(x/60)%24).padStart(2,"0")+":"+String(x%60).padStart(2,"0"):"+"+String(x-(h*60+m)).padStart(3," ");
    let html="", last=-1;
    STOPS.forEach((s,i)=>{
      if(s.s!==last){ last=s.s; const sm=STOPS.filter(z=>z.s===s.s).reduce((a,z)=>a+z.m+(L===120?(z.x||0):0),0); html+=`<div class="ag-row segh"><span class="t"></span><span class="m">${sm}′</span><span><i style="display:inline-block;width:10px;height:10px;background:${SEGS[s.s].c};margin-right:8px"></i>${SEGS[s.s].n}</span><span></span></div>`; }
      const mm=s.m+(L===120?(s.x||0):0);
      html+=`<button class="ag-row" type="button" data-stop="${i}"><span class="t">${f(t)}</span><span class="m">${mm}′</span><span>${esc(s.t)}</span><span class="x">${L===120&&s.x?"+"+s.x:""}</span></button>`; t+=mm;
    });
    html+=`<div class="ag-row"><span class="t">${f(t)}</span><span class="m"></span><span><b>結束</b></span><span></span></div>`;
    $("#agTable").innerHTML=html;
  };
  $$("[data-tlen]").forEach(b=>b.addEventListener("click",()=>{L=+b.dataset.tlen;draw()}));

/* ===== routing: #talk-01..#talk-20 = 講座模式；其他 = 自由探索 ===== */
let mode="talk", stopIdx=0, view="cover", LEN=store.get("len",120);
const main=$("#main");
const mins=s=>s.m+(LEN===120?(s.x||0):0);
function render(v,opt={}){
  view=v;
  let banner="";
  if(mode==="talk"){const s=STOPS[stopIdx];banner=`<div class="stop"><b class="num">${String(stopIdx+1).padStart(2,"0")} / ${STOPS.length}</b><span>${esc(SEGS[s.s].n)}</span><b class="num">本頁 ${mins(s)}′</b>${LEN===120&&s.x?`<span class="plus num">120 版 +${s.x}′</span>`:""}${s.cue?`<span class="cue">講者提示：${esc(s.cue)}</span>`:""}</div>`;}
  const nav = mode==="talk" ? navBtns(stopIdx>0?STOPS[stopIdx-1].t:null, stopIdx<STOPS.length-1?STOPS[stopIdx+1].t:null)
    : (()=>{const i=EXPLORE_ORDER.indexOf(v);return navBtns(i>0?TITLES[EXPLORE_ORDER[i-1]]:null,i>=0&&i<EXPLORE_ORDER.length-1?TITLES[EXPLORE_ORDER[i+1]]:null)})();
  main.innerHTML=`${v!=="cover"?banner:""}<section class="view">${V[v]()}</section>${nav}${v==="cover"&&mode==="talk"?banner:""}`;
  M[v]&&M[v](opt);
  window.scrollTo({top:0});
  updateBar();
  document.title=(v==="cover"?"":TITLES[v]+"｜")+"AI 時代的藝術與教育";
}
const navBtns=(p,n)=>`<nav class="vnav">${p?`<button type="button" data-step="-1"><span>← 上一頁</span>${esc(p)}</button>`:""}${n?`<button class="nx" type="button" data-step="1"><span>下一頁 →</span>${esc(n)}</button>`:""}</nav>`;
function setHash(h){try{history.replaceState(null,"","#"+h)}catch(e){}}
function goStop(i){mode="talk";stopIdx=Math.max(0,Math.min(STOPS.length-1,i));const s=STOPS[stopIdx];setHash("talk-"+String(stopIdx+1).padStart(2,"0"));store.set("mode","talk");render(s.v,{tab:s.tab,c:s.c})}
function goView(v,opt){mode="explore";if(!V[v]||v==="break")v="home";setHash(v);store.set("mode","explore");render(v,opt||{})}
function step(d){ if(mode==="talk") goStop(stopIdx+d); else {const i=EXPLORE_ORDER.indexOf(view);const j=Math.max(0,Math.min(EXPLORE_ORDER.length-1,(i<0?0:i)+d));goView(EXPLORE_ORDER[j])} }
function route(){
  const h=location.hash.slice(1); const m=h.match(/^talk-(\d+)$/);
  if(m) goStop(+m[1]-1); else if(h && V[h]) goView(h); else { mode=store.get("mode","talk"); mode==="talk"?goStop(0):goView("cover"); }
}

/* ===== bar ===== */
const strip=$("#strip"), menu=$("#menu");
function buildStrip(){
  strip.innerHTML=STOPS.map((s,i)=>`<button type="button" data-stop="${i}" style="flex:${mins(s)} 1 0;--sc:${SEGS[s.s].c}" title="${esc((i+1)+". "+s.t+"（"+mins(s)+" 分鐘）")}" aria-label="${esc(s.t)}"></button>`).join("")+'<span class="now" id="nowLine" hidden></span>';
  const segM=SEGS.map((_,k)=>STOPS.filter(s=>s.s===k).reduce((a,s)=>a+mins(s),0));
  $("#seglbl").innerHTML=SEGS.map((g,k)=>`<span style="flex:${segM[k]} 1 0">${g.n} ${segM[k]}′</span>`).join("");
}
menu.innerHTML=MENU.map(([g,items])=>`<span class="grp"><b>${g}</b>${items.map(([v,l])=>`<button type="button" data-view="${v}">${l}</button>`).join("")}</span>`).join("");
function updateBar(){
  const talk=mode==="talk";
  $$("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("#talkTools").hidden=!talk; $("#talkNav").hidden=!talk; menu.hidden=talk;
  $$("[data-len]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.len===LEN));
  $$("#strip button").forEach((b,i)=>{b.classList.toggle("on",talk&&i===stopIdx);b.classList.toggle("done",talk&&i<stopIdx)});
  $$("#menu button").forEach(b=>b.toggleAttribute("aria-current",false));
  if(!talk){const b=menu.querySelector(`[data-view="${view}"]`);b&&b.setAttribute("aria-current","page")}
  $("#stopNo").textContent=talk?`${stopIdx+1}/${STOPS.length}`:"";
}

/* ===== events ===== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-stop],[data-view],[data-step],[data-mode],[data-start],[data-go],[data-len]"); if(!t) return;
  if(t.dataset.stop!=null) goStop(+t.dataset.stop);
  else if(t.dataset.view) goView(t.dataset.view);
  else if(t.dataset.step) step(+t.dataset.step);
  else if(t.dataset.mode) t.dataset.mode==="talk"?goStop(stopIdx):goView(view==="break"?"home":view);
  else if(t.dataset.start) t.dataset.start==="talk"?goStop(1):goView("home");
  else if(t.dataset.go) mode==="talk"?goStop(0):goView("cover");
  else if(t.dataset.len){LEN=+t.dataset.len;store.set("len",LEN);buildStrip();render(view,{tab:STOPS[stopIdx].tab,c:STOPS[stopIdx].c});tick()}
});
$("#prevBtn").addEventListener("click",()=>step(-1));
$("#nextBtn").addEventListener("click",()=>step(1));
$("#fsBtn").addEventListener("click",()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();step(1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();step(-1)}
  else if((e.key==="t"||e.key==="T")&&mode==="talk"){$("#timerBtn").click()}
  else if(e.key==="f"||e.key==="F"){$("#fsBtn").click()}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);const cur=mode==="talk"?"talk-"+String(stopIdx+1).padStart(2,"0"):view;if(h&&h!==cur)route()});

/* ===== timer ===== */
let timer=store.get("timer",{running:false,startedAt:0,acc:0});
const elapsed=()=>timer.acc+(timer.running?Date.now()-timer.startedAt:0);
function tick(){
  const ms=elapsed(),sec=Math.floor(ms/1000),min=ms/60000,c=$("#clock");
  c.innerHTML=`<small>${timer.running?"進行":"計時"}</small>${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}<small style="margin-left:4px">/ ${LEN}</small>`;
  let acc=0,plan=STOPS.length-1;for(let i=0;i<STOPS.length;i++){if(min<acc+mins(STOPS[i])){plan=i;break}acc+=mins(STOPS[i])}
  c.classList.toggle("late",ms>0&&mode==="talk"&&stopIdx<plan);
  c.title=ms>0?`依時間應在：${STOPS[plan].t}（雙擊歸零）`:"講座計時（雙擊歸零）";
  const line=$("#nowLine");if(line){line.hidden=ms===0;line.style.left=Math.min(100,min/LEN*100)+"%"}
  $("#timerBtn").textContent=timer.running?"暫停":(ms>0?"繼續":"開始");
}
$("#timerBtn").addEventListener("click",()=>{if(timer.running){timer.acc=elapsed();timer.running=false}else{timer.startedAt=Date.now();timer.running=true}store.set("timer",timer);tick()});
$("#clock").addEventListener("dblclick",()=>{timer={running:false,startedAt:0,acc:0};store.set("timer",timer);tick()});
setInterval(tick,1000);

buildStrip(); route(); tick();
</script>
