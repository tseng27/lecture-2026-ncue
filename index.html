<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>AI 時代的藝術與教育</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Oswald:wght@500;700&display=swap">
<style>
/* Layout: Bauhaus chapter app. Sticky bar has two faces: 講座模式 (time strip + timer + stops) and 自由探索 (grouped menu). One view on screen at a time. */
:root{
  --bg:#F2F2F0; --paper:#FFFFFF; --ink:#17191F; --muted:#5A606C; --line:#D8D8D4;
  --red:#E63946; --navy:#1D3557; --yellow:#F4D35E; --on-navy:#FFFFFF; --on-yellow:#17191F;
  --accent-ink:#C62835; --navy-ink:#1D3557; --chip:#E7E7E3;
  --ok:#2E7D4F; --ok-bg:#E3F1E8; --warn:#8A5A00; --warn-bg:#FBF0D3; --plan:#4A5578; --plan-bg:#E6E9F2;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-num:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141B; --paper:#19202B; --ink:#EEEDE8; --muted:#A3AAB6; --line:#2C3542;
  --red:#EF4B57; --navy:#2B4C7E; --yellow:#F4D35E; --on-navy:#FFFFFF; --on-yellow:#17191F;
  --accent-ink:#FF7A83; --navy-ink:#9DBBEA; --chip:#232B37;
  --ok:#7BD39E; --ok-bg:#183326; --warn:#F2C56B; --warn-bg:#3A2E12; --plan:#AEB9DA; --plan-bg:#262E45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --paper:#19202B; --ink:#EEEDE8; --muted:#A3AAB6; --line:#2C3542;
  --red:#EF4B57; --navy:#2B4C7E; --yellow:#F4D35E; --on-navy:#FFFFFF; --on-yellow:#17191F;
  --accent-ink:#FF7A83; --navy-ink:#9DBBEA; --chip:#232B37;
  --ok:#7BD39E; --ok-bg:#183326; --warn:#F2C56B; --warn-bg:#3A2E12; --plan:#AEB9DA; --plan-bg:#262E45; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ===== bar ===== */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .row{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:7px;text-decoration:none;font-weight:900;font-size:15px;white-space:nowrap;border:0;background:none;padding:0}
.logo i{display:inline-block;width:13px;height:13px}
.logo .c{border-radius:50%;background:var(--red)}.logo .s{background:var(--navy)}
.logo .t{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:13px solid var(--yellow)}
.modes{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;flex:none}
.modes button{border:0;background:transparent;padding:4px 14px;font-weight:700;font-size:14px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ibtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;height:34px;min-width:34px;padding:0 12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn:hover{border-color:var(--ink)}
.ibtn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.len{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.len button{border:0;background:var(--paper);padding:5px 10px;font-family:var(--f-num);font-weight:700;font-size:13px}
.len button[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow)}
.clock{font-size:14px;font-weight:700;white-space:nowrap;padding:0 4px;cursor:default}
.clock small{color:var(--muted);font-weight:500;margin-right:4px;font-family:var(--f-body)}
.clock.late{color:var(--accent-ink)}
.strip{display:flex;height:30px;border-radius:4px;overflow:hidden;background:var(--chip);position:relative;margin-bottom:8px}
.strip button{border:0;padding:0;background:transparent;position:relative;border-right:2px solid var(--paper);min-width:0;overflow:hidden}
.strip button:last-of-type{border-right:0}
.strip button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--sc)}
.strip button.on{background:var(--ink)}
.strip button.done{background:var(--line)}
.strip button:hover{background:var(--line)}
.strip button.on:hover{background:var(--ink)}
.strip .now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);pointer-events:none;transition:left .5s;z-index:2}
.seglbl{display:flex;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--muted)}
.seglbl span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:6px;min-width:0}
@media (max-width:700px){.seglbl{display:none}}
.menu{display:flex;gap:4px 18px;flex-wrap:wrap;padding-bottom:8px;align-items:baseline}
.menu .grp{display:flex;gap:2px;align-items:baseline;flex-wrap:wrap}
.menu .grp b{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-right:4px}
.menu button{border:0;background:none;padding:3px 7px;border-radius:4px;font-size:14px;font-weight:500}
.menu button:hover{background:var(--chip)}
.menu button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:700}

/* ===== stop banner ===== */
.stop{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:18px;padding:10px 14px;border:1px dashed var(--line);border-radius:6px;font-size:14px;color:var(--muted)}
.stop b{color:var(--ink)}
.stop .cue{flex:1 1 260px}
.stop .plus{background:var(--yellow);color:var(--on-yellow);padding:0 6px;border-radius:2px;font-weight:700}

/* ===== view basics ===== */
main{padding-bottom:80px}
.view{padding-block:30px 20px;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.strip .now{transition:none}}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:14px}
.tag{background:var(--ink);color:var(--bg);padding:2px 10px;border-radius:2px;letter-spacing:.06em;font-size:13px;font-weight:700}
.tag.r{background:var(--red);color:#fff}.tag.n{background:var(--navy);color:var(--on-navy)}.tag.y{background:var(--yellow);color:var(--on-yellow)}
.chno{font-family:var(--f-num);font-weight:700;font-size:clamp(64px,10vw,120px);line-height:.85;letter-spacing:-.04em;color:var(--red)}
.chno.n{color:var(--navy-ink)}
.chhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 26px;align-items:end;margin-bottom:26px}
.chhead h2{font-size:clamp(28px,4vw,48px);font-weight:900}
.chhead h2 small{display:block;font-size:.5em;font-weight:700;color:var(--muted);margin-top:6px}
.chhead .lead{grid-column:1/-1;font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:46em}
@media (max-width:640px){.chhead{grid-template-columns:1fr}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:980px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0}
.card h3{font-size:19px;font-weight:900;margin-bottom:6px}
.card p,.card li{color:var(--muted);font-size:15.5px}
.card ul,.card ol{margin:6px 0 0;padding-left:1.2em}
.sec{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.photo{border-radius:6px;overflow:hidden;background:var(--chip);position:relative;min-height:220px}
.photo img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.photo .cap{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:1px 6px;border-radius:2px}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:26px;align-items:stretch}
@media (max-width:860px){.split{grid-template-columns:1fr}.split .photo{min-height:220px}}
.links{display:flex;flex-wrap:wrap;gap:10px}
.lk{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:2px solid var(--ink);font-weight:700;font-size:15px;text-decoration:none;background:var(--paper)}
.lk:hover{background:var(--ink);color:var(--bg)}
.lk.todo{border-style:dashed;border-color:var(--muted);color:var(--muted);cursor:default}
.lk.todo:hover{background:var(--paper);color:var(--muted)}
.q{font-weight:900;font-size:clamp(22px,2.8vw,34px);line-height:1.4;border-left:10px solid var(--yellow);padding-left:18px}
.q small{display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:999px;padding:5px 13px;font-size:14.5px;font-weight:500}
.note{font-size:13px;color:var(--muted)}
/* status badges: text + color, never color alone */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;white-space:nowrap;vertical-align:middle;letter-spacing:.02em}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.wip{background:var(--warn-bg);color:var(--warn)}
.st.plan{background:var(--plan-bg);color:var(--plan)}
.st.chk{background:var(--chip);color:var(--muted)}
.st.sug{background:var(--yellow);color:var(--on-yellow)}
.shape{width:42px;height:42px;flex:none}
.shape.c{border-radius:50%;background:var(--red)}
.shape.s{background:var(--navy)}
.shape.t{width:0;height:0;border-left:23px solid transparent;border-right:23px solid transparent;border-bottom:40px solid var(--yellow)}

/* tabs / toggles */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 15px;font-weight:700;font-size:15px}
.tab[aria-selected="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 18px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ===== cover ===== */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:14px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(40px,6.4vw,84px);font-weight:900;line-height:1.12}
.hero h1 .hl{background:linear-gradient(transparent 62%,var(--yellow) 62%);padding:0 4px}
.hero .sub{font-size:clamp(17px,1.8vw,22px);color:var(--muted);margin-top:18px;max-width:30em}
.hero .who{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:700}
.composition{aspect-ratio:1/1;position:relative;width:min(500px,100%);justify-self:center}
.composition>*{position:absolute}
.comp-photo{inset:9% 9% 20% 20%;border-radius:0 0 0 999px;overflow:hidden}
.comp-photo img{width:100%;height:100%;object-fit:cover}
.comp-c{width:30%;aspect-ratio:1;border-radius:50%;background:var(--red);left:0;top:0}
.comp-s{width:22%;aspect-ratio:1;background:var(--navy);right:0;bottom:0}
.comp-t{left:12%;bottom:2%;width:0;height:0;border-left:54px solid transparent;border-right:54px solid transparent;border-bottom:92px solid var(--yellow)}
.comp-bar{right:30%;bottom:13%;width:34%;height:10px;background:var(--ink)}
.entry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:30px}
@media (max-width:620px){.entry{grid-template-columns:1fr}}
.entry button{text-align:left;border:2px solid var(--ink);background:var(--paper);border-radius:6px;padding:18px 20px;display:grid;gap:4px}
.entry button:hover{box-shadow:5px 5px 0 var(--ink)}
.entry b{font-size:20px}
.entry span{font-size:14px;color:var(--muted)}

/* themes list */
.themes{display:grid;gap:0;border-top:2px solid var(--ink)}
.theme{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.theme:hover{background:var(--paper)}
.theme .k{font-family:var(--f-num);font-weight:700;font-size:28px;color:var(--accent-ink)}
.theme b{font-size:18px}
.theme small{display:block;color:var(--muted);font-size:14px}
.theme .ord{font-size:12px;color:var(--muted);font-weight:700}

/* agenda */
.ag{border-top:2px solid var(--ink)}
.ag-row{display:grid;grid-template-columns:80px 70px minmax(0,1fr) 60px;gap:12px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.ag-row:hover{background:var(--paper)}
.ag-row.segh{background:var(--chip);font-weight:900;cursor:default}
.ag-row .t{font-family:var(--f-num);font-weight:700}
.ag-row .m{font-family:var(--f-num);font-weight:700;font-size:14px}
.ag-row .x{font-size:12px;font-weight:700;color:var(--warn)}
@media (max-width:620px){.ag-row{grid-template-columns:56px minmax(0,1fr) 44px}.ag-row .t{display:none}}

/* poll */
.poll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.poll{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pbtn{border:2px solid var(--ink);background:var(--paper);border-radius:6px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.pbtn b{font-size:18px}
.pbtn .cnt{font-family:var(--f-num);font-size:32px;font-weight:700;line-height:1}
.pbtn .fill{position:absolute;left:0;bottom:0;height:8px;background:var(--red);transition:width .3s}
.pbtn:nth-child(2) .fill{background:var(--navy)}.pbtn:nth-child(3) .fill{background:var(--yellow)}.pbtn:nth-child(4) .fill{background:var(--muted)}
.mini{font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mini button{border:0;background:none;text-decoration:underline;color:var(--muted);padding:0;font-size:13px}

/* steps */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.steps button{border:2px solid var(--ink);background:var(--paper);border-radius:4px;padding:6px 12px;font-weight:700;font-size:15px;display:inline-flex;gap:6px;align-items:baseline}
.steps button span{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.steps button[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.steps button[aria-selected="true"] span{color:#fff}
.stepbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--paper)}
.stepbox>div{padding:18px;border-right:1px solid var(--line);min-width:0}
.stepbox>div:last-child{border-right:0}
.stepbox .k{font-size:12px;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.stepbox p{font-size:17px;margin-top:4px}
@media (max-width:760px){.stepbox{grid-template-columns:1fr}.stepbox>div{border-right:0;border-bottom:1px solid var(--line)}}
.seven{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
@media (max-width:900px){.seven{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seven div{padding:14px 12px;border-top:6px solid var(--sc);background:var(--paper);border-right:1px solid var(--line);min-width:0}
.seven .k{font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--muted)}
.seven b{display:block;font-size:17px}
.seven p{font-size:13.5px;color:var(--muted)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:10px;align-items:center}
.ba .arrow{font-family:var(--f-num);font-size:30px;font-weight:700;color:var(--red);text-align:center}
@media (max-width:700px){.ba{grid-template-columns:1fr}.ba .arrow{transform:rotate(90deg)}}

/* practice */
.prac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.prac{grid-template-columns:1fr}}
.prac label{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:6px}
.prac input[type=text],.prac textarea{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.prac textarea{min-height:84px;resize:vertical}
.slider{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.slider input{width:100%;accent-color:var(--red)}
.slider span:last-child{text-align:right}
.soundcard{margin-top:16px;background:var(--navy);color:var(--on-navy);border-radius:6px;padding:22px 24px;display:grid;gap:8px}
.soundcard .k{font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.8}
.soundcard b{font-size:22px}
.soundcard p{opacity:.9}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.tbl table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;letter-spacing:.1em;color:var(--muted);background:var(--chip)}
.tbl tr:last-child td{border-bottom:0}

/* cases */
.filters{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:16px;align-items:center}
.filters .grpf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters b{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.fbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.ccard:hover,.ccard[aria-pressed="true"]{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.ccard .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ccard .id{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--muted)}
.ccard b{font-size:17px;line-height:1.35}
.ccard p{font-size:14px;color:var(--muted)}
.detail{margin-top:16px;border-left:6px solid var(--red);background:var(--paper);padding:20px 24px;border-radius:0 6px 6px 0;display:grid;gap:10px}
.detail h3{font-size:24px;font-weight:900}
.detail dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px;margin:0}
.detail dt{font-size:13px;font-weight:700;color:var(--muted)}
.detail dd{margin:0}
@media (max-width:560px){.detail dl{grid-template-columns:1fr}}

/* placeholder media */
.ph{aspect-ratio:4/3;background:var(--chip);border-radius:6px;display:grid;place-items:center;text-align:center;padding:14px;border:1px dashed var(--line);max-width:100%}
.ph span{font-size:13px;color:var(--muted)}
.ph i{display:block;margin:0 auto 8px}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.work{display:grid;gap:6px;min-width:0}
.work b{font-size:15px}
.work small{font-size:12.5px;color:var(--muted)}

/* bars */
.bar100{display:flex;height:46px;border-radius:4px;overflow:hidden;font-weight:900;color:#fff}
.bar100 div{display:flex;align-items:center;padding:0 12px;min-width:0;white-space:nowrap;overflow:hidden}

/* elara */
.members{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.members{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mem{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.mem .sw{height:90px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:26px;letter-spacing:.06em;color:#fff}
.mem .bd{padding:12px 14px;display:grid;gap:4px}
.mem .bd p{font-size:14px;color:var(--muted)}
.check{display:grid;gap:6px}
.check label{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer}
.check input{accent-color:var(--red);width:18px;height:18px}

/* break & closing */
.bigtime{font-family:var(--f-num);font-weight:700;font-size:clamp(96px,16vw,200px);line-height:1;letter-spacing:-.04em}
.bigtime.done{color:var(--accent-ink)}
.quote{font-family:var(--f-serif);font-weight:900;font-size:clamp(40px,7.2vw,96px);line-height:1.25;text-wrap:balance}
.quote span{color:var(--accent-ink)}
.vnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.vnav button{border:0;background:none;text-align:left;padding:6px 0;font-weight:700;max-width:48%}
.vnav button span{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.vnav button.nx{text-align:right;margin-left:auto}
.foot{font-size:12px;color:var(--muted);margin-top:26px;line-height:1.6}
kbd{font-family:var(--f-num);border:1px solid var(--line);border-radius:3px;padding:0 5px;background:var(--paper)}
/* E 拼貼作品集（Collage Portfolio）：灰白紙張、黑白拍立得、紙膠帶、手寫英文點綴、藍色標籤、紅色重點 */
:root:root:root{
  --bg:#ECEBE7; --paper:#FFFFFF; --ink:#141414; --muted:#55575C; --line:#CFCCC4; --chip:#F4F2EC;
  --red:#E0322B; --navy:#2F5DA8; --yellow:#E9D9A6; --on-navy:#FFFFFF; --on-yellow:#141414;
  --accent-ink:#D12A23; --navy-ink:#2F5DA8;
  --tape:rgba(214,196,150,.78);
  --f-hand:"Caveat","Noto Sans TC",cursive;
  --f-cond:"Oswald","Noto Sans TC",sans-serif;
  --f-num:"Oswald","Noto Sans TC",sans-serif;
  color-scheme:light;
}
body{background-color:var(--bg);background-image:
  radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.2px),
  radial-gradient(rgba(0,0,0,.025) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;font-size:17.5px}
body::before{background:var(--bg)}
.bar{background:var(--paper);border-bottom:2px solid var(--ink)}
.logo{font-family:var(--f-cond);font-size:17px;letter-spacing:.02em}
.logo i{display:none}
.logo::before{content:"✦";color:var(--red);margin-right:2px}
.modes{border-width:2px;border-radius:6px}
.modes button[aria-pressed="true"]{background:var(--navy);color:#fff}
.ibtn{border-radius:6px;border:1.5px solid var(--ink)}
.ibtn.go{background:var(--red);border-color:var(--red)}
.len{border-radius:6px;border:1.5px solid var(--ink)}
.len button[aria-pressed="true"]{background:var(--navy);color:#fff}
.clock{font-family:var(--f-cond);font-size:18px}
.strip{border-radius:0;height:22px;background:transparent;gap:3px}
.strip button{background:var(--tape);border-right:0;transform:rotate(-.6deg)}
.strip button:nth-child(2n){transform:rotate(.7deg)}
.strip button::after{height:3px}
.strip button.done{background:#C9BA8C}
.strip button.on{background:var(--ink)}

/* 標題：粗窄體＋手寫點綴＋藍色標籤 */
.eyebrow{letter-spacing:.06em}
.tag,.tag.r,.tag.n,.tag.y{background:var(--navy);color:#fff;border-radius:0;padding:2px 10px;font-family:var(--f-cond);letter-spacing:.06em}
.tag.r{background:var(--red)}
.chhead{position:relative}
.chhead::after{content:"✦";position:absolute;right:4%;top:-6px;font-size:34px;color:var(--ink);transform:rotate(12deg)}
.chno{font-family:var(--f-cond);font-weight:700;color:var(--ink);letter-spacing:-.02em;-webkit-text-stroke:0;position:relative}
.chno::after{content:"";position:absolute;left:-6%;right:-6%;bottom:12%;height:22%;background:var(--red);opacity:.85;z-index:-1;transform:rotate(-2deg)}
.chno.n::after{background:var(--navy)}
.chhead h2{font-weight:900;letter-spacing:-.01em}
.chhead h2 small{font-family:var(--f-hand);font-size:.62em;font-weight:600;color:var(--red);letter-spacing:0}
.sec{font-family:var(--f-cond);color:var(--ink);font-size:15px;letter-spacing:.08em}
.sec::after{height:0;border-top:2px dashed var(--ink)}

/* 卡片：白紙＋紙膠帶＋微旋轉 */
.card,.ccard,.idc,.unit,.mem,.pbtn,.entry button,.fstep{border:0!important;border-radius:2px;background:var(--paper);box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 22px -10px rgba(0,0,0,.35);position:relative}
.card::before,.ccard::before,.idc::before,.entry button::before,.pbtn::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;background:var(--tape);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.grid>*:nth-child(3n+1){transform:rotate(-.6deg)}
.grid>*:nth-child(3n+2){transform:rotate(.5deg)}
.grid>*:nth-child(2n) ::before{transform:rotate(5deg)}
.grid{gap:30px}
.cgrid{gap:26px}
.ccard:nth-child(odd){transform:rotate(-.5deg)}.ccard:nth-child(even){transform:rotate(.5deg)}
.ccard:hover,.ccard[aria-pressed="true"],.idc[aria-pressed="true"]{outline:2px solid var(--red);outline-offset:4px;box-shadow:0 10px 22px -10px rgba(0,0,0,.35)}
.card h3{font-weight:900}
.detail,.id-detail{border-left:0;background:var(--paper);box-shadow:0 10px 22px -10px rgba(0,0,0,.35);border-top:6px solid var(--navy)}
.shape{width:36px;height:36px}
.shape.c{background:var(--red)}.shape.s{background:var(--navy)}.shape.t{border-bottom-color:var(--ink)}

/* 照片：黑白拍立得 */
.photo{background:var(--paper);padding:14px 14px 54px;border-radius:2px;box-shadow:0 14px 28px -12px rgba(0,0,0,.45);transform:rotate(1.6deg);overflow:visible;min-height:320px}
.photo img{position:absolute;inset:14px 14px 54px;width:calc(100% - 28px);height:calc(100% - 68px);filter:grayscale(1) contrast(1.08)}
.photo::before{content:"";position:absolute;top:-12px;left:28%;width:110px;height:26px;background:var(--tape);transform:rotate(-6deg);z-index:2}
.photo .cap{position:absolute;left:auto;right:18px;bottom:12px;background:none;color:var(--ink);font-family:var(--f-hand);font-size:22px;padding:0;letter-spacing:0}
.ph{background:var(--paper);border:0;border-radius:2px;padding:12px 12px 44px;box-shadow:0 10px 22px -10px rgba(0,0,0,.4);position:relative;aspect-ratio:4/5}
.ph::before{content:"";position:absolute;inset:12px 12px 44px;background:repeating-linear-gradient(45deg,#E6E3DC 0 10px,#EFEDE7 10px 20px)}
.ph i{display:none}
.ph span{position:absolute;left:0;right:0;bottom:8px;font-family:var(--f-hand);font-size:20px;color:var(--ink)}
.works{gap:28px 22px}
.work:nth-child(odd) .ph{transform:rotate(-1.4deg)}.work:nth-child(even) .ph{transform:rotate(1.2deg)}
.work b{font-weight:900}

/* 按鈕：貼紙 */
.lk{border:2px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.lk:hover{background:var(--red);border-color:var(--red);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.lk.todo{box-shadow:none}
.tab,.fbtn,.steps button,.opt{border-radius:4px!important;border:1.5px solid var(--ink)!important;background:var(--paper)}
.tab[aria-selected="true"],.fbtn[aria-pressed="true"]{background:var(--navy)!important;color:#fff;border-color:var(--navy)!important}
.steps button[aria-selected="true"]{background:var(--red)!important;border-color:var(--red)!important}
.opt[aria-pressed="true"]{box-shadow:4px 4px 0 var(--red)}
.seg{border-radius:4px}
.seg button[aria-pressed="true"]{background:var(--navy)}
.pbtn{border-radius:2px}
.pbtn .cnt{font-family:var(--f-cond)}
.chip{background:var(--paper);border:1.5px dashed var(--ink);border-radius:4px}

/* 筆記本紙：提問、任務卡 */
.q{border-left:0;background:var(--paper);padding:34px 28px 24px;box-shadow:0 10px 22px -10px rgba(0,0,0,.35);
  background-image:radial-gradient(circle at 14px 12px,var(--bg) 5px,transparent 5.5px),repeating-linear-gradient(transparent 0 33px,#D9E3F1 33px 34px);
  background-size:28px 24px,100% 34px;background-repeat:repeat-x,repeat;transform:rotate(-.5deg)}
.q small{font-family:var(--f-hand);font-size:22px;color:var(--red)}
.taskcard,.soundcard{border-radius:2px;background:var(--navy);box-shadow:0 14px 26px -12px rgba(0,0,0,.5);transform:rotate(.4deg)}
.stop{border:0;background:var(--yellow);border-radius:0;box-shadow:0 6px 14px -8px rgba(0,0,0,.4);transform:rotate(-.3deg)}
.stop .cue::before{content:"memo — ";font-family:var(--f-hand);font-size:19px;color:var(--red)}
.stepbox,.tbl,.ag{border:0;border-radius:2px;background:var(--paper);box-shadow:0 10px 22px -10px rgba(0,0,0,.35)}
.ag{padding:6px 16px}
.ag-row.segh{background:var(--chip)}
.seven div{border-top-width:8px;box-shadow:0 8px 16px -10px rgba(0,0,0,.35)}
.theme{border-bottom:1.5px dashed var(--ink)}
.theme .k{font-family:var(--f-cond)}
.bar100{border-radius:0;box-shadow:0 8px 16px -10px rgba(0,0,0,.4)}
.mem .sw{filter:grayscale(1) contrast(1.05);font-family:var(--f-cond)}
.prac input[type=text],.prac textarea{border:1.5px solid var(--ink);border-radius:2px;background:var(--paper)}
.vnav{border-top:2px dashed var(--ink)}
.vnav button{font-family:var(--f-cond);font-size:17px}
.bigtime{font-family:var(--f-cond)}
.quote{font-weight:900}
.quote span{color:var(--paper);background:var(--red);padding:0 .15em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* 封面 */
.hero h1{font-weight:900;letter-spacing:-.01em}
.hero h1 .hl{background:var(--navy);color:#fff;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.composition>*:not(.comp-photo){display:none}
.composition{width:min(520px,100%)}
.comp-photo{inset:4% 6% 6% 6%;border-radius:2px;background:var(--paper);padding:16px 16px 70px;box-shadow:0 18px 34px -14px rgba(0,0,0,.5);transform:rotate(3deg);overflow:visible}
.comp-photo img{width:100%;height:100%;filter:grayscale(1) contrast(1.1)}
.comp-photo::before{content:"";position:absolute;top:-14px;left:36%;width:130px;height:30px;background:var(--tape);transform:rotate(-5deg)}
.comp-photo::after{content:"Your life is your artwork.";position:absolute;left:18px;bottom:16px;font-family:var(--f-hand);font-size:30px;color:var(--ink)}
.composition::after{content:"✦  create · teach · reflect";position:absolute;right:-2%;top:-4%;font-family:var(--f-hand);font-size:26px;color:var(--red);transform:rotate(-6deg)}
.entry button:first-child{background:var(--red);color:#fff}
.entry button:first-child span{color:rgba(255,255,255,.85)}

/* ===== 封面拼貼版型 ===== */
.collage{position:relative;height:min(80vh,720px);min-height:620px;margin-top:6px;background:#F7F6F2;box-shadow:0 18px 40px -20px rgba(0,0,0,.4);overflow:hidden;
  background-image:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1.3px);background-size:6px 6px}
.collage>*{position:absolute}
.c-hand{font-family:var(--f-hand);font-weight:600}
.c-tl{left:4%;top:4%;font-size:30px}
.c-date{right:4%;top:4%;text-align:right;font-family:var(--f-cond);line-height:1}
.c-date span{display:block;font-size:22px;color:var(--muted)}
.c-date b{font-size:40px}
.c-main{left:33%;top:6%;width:34%;height:88%;overflow:hidden}
.c-main img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:grayscale(1) contrast(1.12);-webkit-mask-image:radial-gradient(ellipse 70% 80% at 50% 45%,#000 62%,transparent 64%);mask-image:radial-gradient(ellipse 70% 80% at 50% 45%,#000 62%,transparent 64%)}
.c-intro{left:4%;top:15%;width:26%}
.c-label{display:inline-block;background:var(--navy);color:#fff;font-family:var(--f-cond);font-size:18px;padding:2px 10px;margin-bottom:10px}
.c-intro p{font-size:14px;line-height:1.7;color:var(--ink)}
.c-pola{left:57%;top:56%;width:15%;z-index:2;margin:0;background:#fff;padding:10px 10px 42px;box-shadow:0 14px 26px -12px rgba(0,0,0,.5);transform:rotate(6deg)}
.c-pola img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1) contrast(1.1)}
.c-pola figcaption{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--f-hand);font-size:24px;color:var(--red)}
.c-note{right:5%;top:15%;width:26%;background:#fff;padding:34px 20px 16px;box-shadow:0 14px 26px -12px rgba(0,0,0,.45);transform:rotate(2.5deg);
  background-image:radial-gradient(circle at 12px 12px,#F7F6F2 5px,transparent 5.5px),repeating-linear-gradient(transparent 0 31px,#DCE4F0 31px 32px);background-size:24px 24px,100% 32px;background-repeat:repeat-x,repeat}
.c-note b{font-size:30px;display:block;margin-bottom:4px}
.c-note ul{list-style:none;margin:0;padding:0;font-size:15px;line-height:32px}
.c-note li{display:flex;align-items:center;gap:8px}
.c-note li i{width:12px;height:12px;flex:none}
.c-note li span{margin-left:auto;font-family:var(--f-cond)}
.c-note::after{content:"";position:absolute;right:16px;top:-8px;width:18px;height:18px;border-radius:50%;background:var(--red);box-shadow:inset -3px -3px 5px rgba(0,0,0,.3)}
.c-sticky{right:4%;top:66%;width:19%;background:var(--yellow);padding:18px 16px;font-family:var(--f-serif,serif);font-weight:900;font-size:19px;line-height:1.5;transform:rotate(-4deg);box-shadow:0 12px 20px -10px rgba(0,0,0,.4)}
.c-title{left:4%;bottom:5%;width:52%;z-index:3}
.c-title h1{font-size:clamp(40px,5vw,72px);font-weight:900;line-height:1.22;letter-spacing:-.01em}
.c-title h1 span{background:var(--red);color:#fff;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.c-sub{font-family:var(--f-cond);font-size:20px;margin-top:10px;letter-spacing:.04em}
.c-who{font-size:13px;color:var(--muted);margin-top:4px}
.c-who b{color:var(--ink)}
.c-star{font-size:40px;color:var(--ink)}
.c-star.s1{left:31%;top:9%;transform:rotate(15deg)}
.c-star.s2{right:33%;bottom:18%;font-size:30px;color:var(--red)}
.c-scrib{right:5%;bottom:5%;font-size:26px;color:var(--red);transform:rotate(-3deg)}
.c-tape{width:110px;height:26px;background:var(--tape)}
.c-tape.t1{left:61%;top:53%;transform:rotate(12deg);z-index:3}
.c-tape.t2{right:13%;top:13%;transform:rotate(8deg);z-index:2}
@media (max-width:860px){
  .collage{height:auto;min-height:0;display:flex;flex-direction:column;gap:22px;padding:24px 18px 28px}
  .collage>*{position:relative;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:auto!important}
  .c-main{height:300px;order:2}.c-title{order:1}.c-intro{order:3}.c-note{order:4}.c-pola{order:5;width:70%!important;align-self:center}.c-sticky{order:6;align-self:flex-end;width:70%!important}
  .c-date{position:absolute!important;right:16px!important;top:16px!important}
  .c-star,.c-tape,.c-scrib{display:none}
}
/* 章節頁頭：剪貼標題 */
.chhead{background:#fff;padding:26px 28px;box-shadow:0 12px 24px -14px rgba(0,0,0,.4);transform:rotate(-.4deg);margin-top:12px}
.chhead::before{content:"";position:absolute;top:-12px;left:30px;width:100px;height:24px;background:var(--tape);transform:rotate(-5deg)}

/* 封面中間放講者完整海報（不裁切、不去色） */
.c-main{left:37.5%;top:8%;width:33%;height:auto;overflow:visible;z-index:1}
.c-main img{height:auto;object-fit:contain;filter:none;-webkit-mask-image:none;mask-image:none;background:#fff;padding:8px;box-shadow:0 18px 34px -14px rgba(0,0,0,.45);transform:rotate(-1.2deg)}
.c-intro{width:24%}.c-note{width:24%;right:3%}
.c-pola{display:none}
.c-tape.t1{left:49%;top:5%;transform:rotate(-6deg)}
@media (max-width:860px){.c-main{height:auto!important}.c-main img{transform:none}}

/* 關於我：AI 公仔拍立得牆（彩色、不裁切臉、不套灰階） */
.about-gal{background:var(--paper);padding:18px 12px 12px;border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 22px -10px rgba(0,0,0,.35);position:relative;min-width:0;max-width:100%}
.about-gal::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;background:var(--tape);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.about-gal-title{font-family:var(--f-hand);font-size:clamp(20px,2.4vw,28px);text-align:center;margin:2px 0 8px;color:var(--ink);line-height:1.15}
.about-gal-note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0;letter-spacing:.02em}
.about-gal-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;padding:10px 8px 4px;overflow:hidden}
.about-pola{appearance:none;-webkit-appearance:none;border:0;background:var(--paper);padding:6px 6px 28px;border-radius:1px;box-shadow:0 8px 16px -10px rgba(0,0,0,.45);cursor:pointer;transform:rotate(var(--r,0deg));position:relative;min-width:0;width:auto;flex:0 1 calc((100% - 48px) / 5);max-width:calc((100% - 48px) / 5);box-sizing:border-box;display:block;text-align:center;color:inherit}
.about-pola::before{content:"";position:absolute;top:-8px;left:50%;width:36px;height:12px;margin-left:-18px;background:var(--tape);transform:rotate(-6deg);z-index:1;pointer-events:none}
.about-pola:nth-child(even)::before{transform:rotate(7deg)}
.about-pola:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.about-pola img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:contain;background:#F3F1EB;filter:none;-webkit-filter:none}
.about-pola-cap{display:block;position:absolute;left:2px;right:2px;bottom:3px;font-family:var(--f-hand);font-size:clamp(10px,1.45vw,14px);text-align:center;color:var(--ink);line-height:1.15;white-space:normal}
.about-lb{position:fixed;inset:0;z-index:80;background:rgba(20,20,20,.78);display:grid;place-items:center;padding:24px 16px}
.about-lb[hidden]{display:none!important}
.about-lb figure{margin:0;max-width:min(92vw,520px);width:100%;background:#fff;padding:14px 14px 52px;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);transform:rotate(-.6deg);position:relative}

/* ===== routing: #talk-01..#talk-21 = 講座模式；其他 = 自由探索 ===== */
let mode="talk", stopIdx=0, view="cover", LEN=store.get("len110",110);
const main=$("#main");
const mins=s=>s.m+(LEN===120?(s.x||0):0);
function closeAboutLb(){const lb=document.getElementById("aboutLb");if(lb) lb.hidden=true}
function openAboutLb(i){
  const im=ABOUT_IMGS[i]; if(!im) return;
  let lb=document.getElementById("aboutLb");
  if(!lb){
    lb=document.createElement("div");
    lb.id="aboutLb"; lb.className="about-lb"; lb.hidden=true;
    lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true"); lb.setAttribute("aria-label","形象圖預覽");
    lb.innerHTML='<button type="button" class="about-lb-x" aria-label="關閉">×</button><figure><img alt=""><figcaption></figcaption></figure>';
    document.body.appendChild(lb);
    lb.addEventListener("click",e=>{if(e.target===lb||e.target.closest(".about-lb-x")) closeAboutLb()});
  }
  const img=lb.querySelector("img");
  img.src=im.src; img.alt=im.label;
  lb.querySelector("figcaption").textContent="如果我是「"+im.label+"」　·　AI 生成形象圖";
  lb.hidden=false;
}
function render(v,opt={}){
  closeAboutLb();
  view=v;
  let banner="";
  if(mode==="talk"){const s=STOPS[stopIdx];banner=`<div class="stop"><b class="num">${String(stopIdx+1).padStart(2,"0")} / ${STOPS.length}</b><span>${esc(SEGS[s.s].n)}</span><b class="num">本頁 ${mins(s)}′</b>${s.opt?'<span class="optag">可略過</span>':""}${LEN===120&&s.x?`<span class="plus num">120 版 +${s.x}′</span>`:""}${s.cue?`<span class="cue">講者提示：${esc(s.cue)}</span>`:""}</div>`;}
  const nav = mode==="talk" ? navBtns(stopIdx>0?STOPS[stopIdx-1].t:null, stopIdx<STOPS.length-1?STOPS[stopIdx+1].t:null)
    : (()=>{const i=EXPLORE_ORDER.indexOf(v);return navBtns(i>0?TITLES[EXPLORE_ORDER[i-1]]:null,i>=0&&i<EXPLORE_ORDER.length-1?TITLES[EXPLORE_ORDER[i+1]]:null)})();
  main.innerHTML=`${v!=="cover"?banner:""}<section class="view">${V[v]()}</section>${nav}${v==="cover"&&mode==="talk"?banner:""}`;
  M[v]&&M[v](opt);
  window.scrollTo({top:0});
  updateBar();
  document.title=(v==="cover"?"":TITLES[v]+"｜")+"AI 時代的藝術與教育";
}
const navBtns=(p,n)=>`<nav class="vnav">${p?`<button type="button" data-step="-1"><span>← 上一頁</span>${esc(p)}</button>`:""}${n?`<button class="nx" type="button" data-step="1"><span>下一頁 →</span>${esc(n)}</button>`:""}</nav>`;
function setHash(h){try{history.replaceState(null,"","#"+h)}catch(e){}}
function goStop(i){mode="talk";stopIdx=Math.max(0,Math.min(STOPS.length-1,i));const s=STOPS[stopIdx];setHash("talk-"+String(stopIdx+1).padStart(2,"0"));store.set("mode","talk");render(s.v,{tab:s.tab,c:s.c})}
function goView(v,opt){mode="explore";if(!V[v]||v==="break")v="home";setHash(v);store.set("mode","explore");render(v,opt||{})}
function step(d){ if(mode==="talk") goStop(stopIdx+d); else {const i=EXPLORE_ORDER.indexOf(view);const j=Math.max(0,Math.min(EXPLORE_ORDER.length-1,(i<0?0:i)+d));goView(EXPLORE_ORDER[j])} }
function route(){
  const h=location.hash.slice(1); const m=h.match(/^talk-(\d+)$/);
  if(m) goStop(+m[1]-1); else if(h && V[h]) goView(h); else { mode=store.get("mode","talk"); mode==="talk"?goStop(0):goView("cover"); }
}

/* ===== bar ===== */
const strip=$("#strip"), menu=$("#menu");
function buildStrip(){
  strip.innerHTML=STOPS.map((s,i)=>`<button type="button" data-stop="${i}" style="flex:${mins(s)} 1 0;--sc:${SEGS[s.s].c}" title="${esc((i+1)+". "+s.t+"（"+mins(s)+" 分鐘）")}" aria-label="${esc(s.t)}"></button>`).join("")+'<span class="now" id="nowLine" hidden></span>';
  const segM=SEGS.map((_,k)=>STOPS.filter(s=>s.s===k).reduce((a,s)=>a+mins(s),0));
  $("#seglbl").innerHTML=SEGS.map((g,k)=>`<span style="flex:${segM[k]} 1 0">${g.n} ${segM[k]}′</span>`).join("");
}
menu.innerHTML=MENU.map(([g,items])=>`<span class="grp"><b>${g}</b>${items.map(([v,l])=>`<button type="button" data-view="${v}">${l}</button>`).join("")}</span>`).join("");
function updateBar(){
  const talk=mode==="talk";
  $$("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("#talkTools").hidden=!talk; $("#talkNav").hidden=!talk; menu.hidden=talk;
  $$("[data-len]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.len===LEN));
  $$("#strip button").forEach((b,i)=>{b.classList.toggle("on",talk&&i===stopIdx);b.classList.toggle("done",talk&&i<stopIdx)});
  $$("#menu button").forEach(b=>b.toggleAttribute("aria-current",false));
  if(!talk){const b=menu.querySelector(`[data-view="${view}"]`);b&&b.setAttribute("aria-current","page")}
  $("#stopNo").textContent=talk?`${stopIdx+1}/${STOPS.length}`:"";
}

/* ===== events ===== */
document.addEventListener("click",e=>{
  const ab=e.target.closest("[data-about]"); if(ab){ openAboutLb(+ab.dataset.about); return; }
  const t=e.target.closest("[data-stop],[data-view],[data-step],[data-mode],[data-start],[data-go],[data-len]"); if(!t) return;
  if(t.dataset.stop!=null) goStop(+t.dataset.stop);
  else if(t.dataset.view) goView(t.dataset.view);
  else if(t.dataset.step) step(+t.dataset.step);
  else if(t.dataset.mode) t.dataset.mode==="talk"?goStop(stopIdx):goView(view==="break"?"home":view);
  else if(t.dataset.start) t.dataset.start==="talk"?goStop(1):goView("home");
  else if(t.dataset.go) mode==="talk"?goStop(0):goView("cover");
  else if(t.dataset.len){LEN=+t.dataset.len;store.set("len110",LEN);buildStrip();render(view,{tab:STOPS[stopIdx].tab,c:STOPS[stopIdx].c});tick()}
});
$("#prevBtn").addEventListener("click",()=>step(-1));
$("#nextBtn").addEventListener("click",()=>step(1));
$("#fsBtn").addEventListener("click",()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")) return;
  const lb=document.getElementById("aboutLb");
  if(lb && !lb.hidden){ if(e.key==="Escape"){e.preventDefault();closeAboutLb()} return; }
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();step(1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();step(-1)}
  else if((e.key==="t"||e.key==="T")&&mode==="talk"){$("#timerBtn").click()}
  else if(e.key==="f"||e.key==="F"){$("#fsBtn").click()}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);const cur=mode==="talk"?"talk-"+String(stopIdx+1).padStart(2,"0"):view;if(h&&h!==cur)route()});

/* ===== timer ===== */
let timer=store.get("timer",{running:false,startedAt:0,acc:0});
const elapsed=()=>timer.acc+(timer.running?Date.now()-timer.startedAt:0);
function tick(){
  const ms=elapsed(),sec=Math.floor(ms/1000),min=ms/60000,c=$("#clock");
  c.innerHTML=`<small>${timer.running?"進行":"計時"}</small>${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}<small style="margin-left:4px">/ ${LEN}</small>`;
  let acc=0,plan=STOPS.length-1;for(let i=0;i<STOPS.length;i++){if(min<acc+mins(STOPS[i])){plan=i;break}acc+=mins(STOPS[i])}
  c.classList.toggle("late",ms>0&&mode==="talk"&&stopIdx<plan);
  c.title=ms>0?`依時間應在：${STOPS[plan].t}（雙擊歸零）`:"講座計時（雙擊歸零）";
  const line=$("#nowLine");if(line){line.hidden=ms===0;line.style.left=Math.min(100,min/LEN*100)+"%"}
  $("#timerBtn").textContent=timer.running?"暫停":(ms>0?"繼續":"開始");
}
$("#timerBtn").addEventListener("click",()=>{if(timer.running){timer.acc=elapsed();timer.running=false}else{timer.startedAt=Date.now();timer.running=true}store.set("timer",timer);tick()});
$("#clock").addEventListener("dblclick",()=>{timer={running:false,startedAt:0,acc:0};store.set("timer",timer);tick()});
setInterval(tick,1000);

buildStrip(); route(); tick();
</script>
